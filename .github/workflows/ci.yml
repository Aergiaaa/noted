# Tests every push on every branch, plus PRs into staging/main.
# Both suites gate at 100% coverage — a red gate blocks the promote
# workflow from opening the feat/* → staging PR.
name: ci

on:
  push:
  pull_request:
    branches: [staging, main]

jobs:
  back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # go.sum lives in back/, not the repo root — without this the
          # cache step warns "Dependencies file is not found".
          cache-dependency-path: back/go.sum
      - name: vet + build
        working-directory: back
        run: |
          go vet ./...
          CGO_ENABLED=0 go build ./...
      - name: test with 100% gate (excl. main.go func main entrypoint)
        working-directory: back
        run: |
          mkdir -p coverage
          CGO_ENABLED=0 go test -count=1 -coverprofile=coverage/cover.out ./...
          CGO_ENABLED=0 go tool cover -func=coverage/cover.out | tee coverage/func.txt
          awk '$1 == "total:" { next } $1 ~ /main\.go:/ && $2 == "main" { next } $3 != "100.0%" { bad=1; print "BELOW 100%: " $0 } END { exit bad }' coverage/func.txt

  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install (frozen lockfile)
        working-directory: front
        run: bun install --frozen-lockfile
      - name: typecheck + prod build
        working-directory: front
        run: bun run build
      - name: test with 100% gate (vitest thresholds)
        working-directory: front
        run: bunx --bun vitest run --coverage
